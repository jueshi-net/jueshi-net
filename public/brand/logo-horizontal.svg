<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="50" viewBox="0 0 240 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Horizontal Logo: Mark + Text (Optimized for Header) -->
  
  <!-- Logo Mark: Hexagonal Badge -->
  <g id="mark">
    <!-- Hexagon Badge -->
    <path d="M25 5 L42 14 L42 34 L25 43 L8 34 L8 14 Z" 
          fill="#0F3D5E" 
          stroke="#14B8A6" 
          stroke-width="2"/>
    
    <!-- Inner Tool Symbol -->
    <circle cx="25" cy="20" r="3.5" fill="#14B8A6"/>
    <rect x="23" y="23" width="4" height="10" rx="1" fill="#14B8A6"/>
    
    <!-- Cross-border Route Arrow -->
    <path d="M16 30 Q20 34, 25 32 Q30 30, 34 34" 
          stroke="#F59E0B" 
          stroke-width="1.5" 
          fill="none" 
          stroke-linecap="round"/>
    <path d="M32 32 L34 34 L32 36" 
          stroke="#F59E0B" 
          stroke-width="1.5" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Logo Text -->
  <g id="text">
    <!-- Chinese Name -->
    <text x="55" y="22" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="700" 
          fill="#0F3D5E">
      海外百宝箱
    </text>
    
    <!-- English Domain -->
    <text x="55" y="38" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10" 
          font-weight="400" 
          fill="#14B8A6">
      jueshi.net
    </text>
  </g>
</svg>
