geo:
  directAnswer:
    question: 留学生出国前要准备什么？
    answer: 留学生出国前必须准备：1) 签证和护照；2) 机票和住宿；3) 行李和衣物；4) 银行卡和外币；5) 手机卡和必备 APP；6) 保险；7) 重要文件备份。建议提前 3 个月开始准备。
  geographicTargeting:
    primaryCountries:
      - CA
      - US
      - UK
      - AU
  faq:
    questions:
      - q: 出国前要提前多久准备？
        a: 建议提前 3 个月开始准备，至少提前 1 个月完成所有事项。
      - q: 行李有限制吗？
        a: 大多数航空公司允许 2 件行李，每件 23kg。建议提前确认航空公司政策。
      - q: 需要带多少现金？
        a: 建议携带 1000-2000 等值外币现金，用于初期开销。大部分地方可刷卡。

