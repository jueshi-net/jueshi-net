content:
  summary: 出国前必做事项清单：从签证到报到，一步步帮你做好准备。
  steps:
    - title: 确认签证
      description: 检查签证有效期，确认入境要求。打印签证页备份。
      completed: false
      optional: false
      tool_link: null
    - title: 预订机票
      description: 比较价格，选择合适航班。建议提前 1-2 个月预订。
      completed: false
      optional: false
      tool_link: null
    - title: 安排住宿
      description: 学校宿舍或校外租房。确认入住日期和地址。
      completed: false
      optional: false
      tool_link: null
    - title: 准备行李
      description: 根据目的地气候准备衣物。注意航空公司行李限额。
      completed: false
      optional: false
      tool_link: null
    - title: 开通国际银行服务
      description: 办理双币信用卡，了解境外取现政策。
      completed: false
      optional: false
      tool_link: /tools/exchange-rate
    - title: 购买手机卡
      description: 开通国际漫游或购买当地手机卡。
      completed: false
      optional: false
      tool_link: null
    - title: 下载必备 APP
      description: WhatsApp、Google Maps、Wise 等必备应用。
      completed: false
      optional: false
      tool_link: /topics/must-have-apps
    - title: 购买保险
      description: 学校保险或私人保险。确认覆盖范围。
      completed: false
      optional: false
      tool_link: null
    - title: 准备重要文件
      description: 护照、签证、录取通知书、成绩单、照片。
      completed: false
      optional: false
      tool_link: null
    - title: 兑换外币
      description: 提前兑换少量外币，用于初期开销。
      completed: false
      optional: false
      tool_link: /tools/exchange-rate
